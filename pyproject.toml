[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voidai"
version = "0.1.0"
description = "Local-first, evidence-bound agent runtime for SOC detection and triage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["security", "soc", "detection", "threat-hunting", "local-ai", "edge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Deliberately minimal. Every dependency here must run on a Raspberry Pi 5
# without a compiler toolchain and without a GPU. Anything that cannot be
# installed from a manylinux/musllinux aarch64 wheel does not belong in the
# core; it belongs behind an extra.
dependencies = [
    "polars>=1.0",
    "numpy>=1.24",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.2",
]

[project.optional-dependencies]
# The language layer. Optional on purpose: VoidLexicon performs its full detection
# and correlation pipeline with this uninstalled. See `voidai run --no-llm`.
llm = [
    "llama-cpp-python>=0.3.0",
]
tui = [
    "textual>=0.60",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Test-only. Generated Sigma rules are parsed back and asserted against,
    # rather than string-matched — a rule that merely looks like YAML is a
    # rule that fails in someone else's console.
    "pyyaml>=6.0",
]

[project.scripts]
voidai = "voidai.cli:app"

[project.urls]
Homepage = "https://github.com/CypherNova1337/VoidLexicon"
Repository = "https://github.com/CypherNova1337/VoidLexicon"

[tool.hatch.build.targets.wheel]
packages = ["src/voidai"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as argument defaults; that is its documented idiom.
"src/voidai/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
